<body>
   <header class="container-fluid">
    <img src="images/logo2.png" alt="Notre Logo" />
   </header>

  <nav class="container navigation" aria-label="Navigation principale">

    <button
        class="menu-burger"
        id="menu-burger"
        type="button"

 </nav>
    
        <div class="galerie-intro container">
          <h1>Galerie photos</h1>
          <p>Des instants précieux, des émotions authentiques.</p>
        </div>
    
   <main class="content">
       
        <section id="filtre" aria-label="Filtrer les photos par catégorie">
          <div id="tout" class="filtre-actif" role="button" tabindex="0">Tout</div>
          <div id="mariage" role="button" tabindex="0">Mariages</div>
          <div id="grossesse" role="button" tabindex="0">Grossesses</div>
          <div id="bebe" role="button" tabindex="0">Bébés</div>
          <div id="famille" role="button" tabindex="0">Famille</div>
          <div id="bapteme" role="button" tabindex="0">Baptêmes</div>
          <div id="couple" role="button" tabindex="0">Couples</div>
        </section>  
       
        <div id="galerie">
          <img class="active" data-mariage src="Galerie/mariage1.png" alt="Photographie de mariage" loading="lazy">
          <img class="active" data-grossesse src="Galerie/grossesse.jpg" alt="Séance photo grossesse" loading="lazy">
          <img class="active" data-bebe src="Galerie/bebe.jpg" alt="Photographie de bébé" loading="lazy">
          <img class="active" data-famille src="Galerie/famille1.png" alt="Portrait de famille" loading="lazy">
          <img class="active" data-bapteme src="Galerie/bapteme.jpg" alt="Photographie de baptême" loading="lazy">
          <img class="active" data-couple src="Galerie/couple.jpg" alt="Séance photo de couple" loading="lazy">
        
          <img class="active" data-mariage src="Galerie/mariage2.png" alt="Autre photographie de mariage" loading="lazy">
          <img class="active" data-grossesse src="Galerie/Grossesse2.jpg" alt="Autre séance photo grossesse" loading="lazy">
          <img class="active" data-bebe src="Galerie/bb2.jpg" alt="Autre photographie de bébé" loading="lazy">
          <img class="active" data-famille src="Galerie/famille2.png" alt="Autre portrait de famille" loading="lazy">
          <img class="active" data-bapteme src="Galerie/bapteme2.jpg" alt="Autre photographie de baptême" loading="lazy">
          <img class="active" data-couple src="Galerie/couple2.jpg" alt="Autre séance photo de couple" loading="lazy">
        </div>
       
   </main>
